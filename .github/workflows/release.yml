name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v0.4.1) to publish a GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto

jobs:
  build:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web client
        run: |
          cd web
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build all platform binaries
        run: node scripts/build.mjs --all --skip-web

      - name: Package release archives
        run: |
          mkdir -p build
          cp dist/myairouter-windows-amd64.exe build/
          cp dist/myairouter-windows-arm64.exe build/
          (cd dist && tar czf ../build/myairouter-linux-amd64.tar.gz myairouter-linux-amd64)
          (cd dist && tar czf ../build/myairouter-linux-arm64.tar.gz myairouter-linux-arm64)
          (cd dist && tar czf ../build/myairouter-darwin-amd64.tar.gz myairouter-darwin-amd64)
          (cd dist && tar czf ../build/myairouter-darwin-arm64.tar.gz myairouter-darwin-arm64)
          (cd dist && zip -q ../build/myairouter-windows-amd64.zip myairouter-windows-amd64.exe)
          (cd dist && zip -q ../build/myairouter-windows-arm64.zip myairouter-windows-arm64.exe)

      - name: Generate checksums
        run: cd build && sha256sum *.tar.gz *.zip *.exe > checksums.txt

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$VERSION" = "main" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              VERSION="${{ inputs.tag }}"
              VERSION="${VERSION#v}"
            else
              VERSION=$(grep 'myairouter v[0-9]' main.go | sed 's/.*myairouter v//' | sed 's/[^0-9.]*//g')
            fi
          fi
          echo "{\"version\":\"$VERSION\",\"url\":\"${{ vars.R2_PUBLIC_URL }}/releases\"}" > build/latest.json

      - name: Upload to Cloudflare R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_BUCKET" ]; then
            aws s3 sync build/ "s3://${R2_BUCKET}/releases/" --no-progress
          else
            echo "R2_BUCKET secret not set; skipping R2 upload."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            build/*.tar.gz
            build/*.zip
            build/*.exe
            build/checksums.txt
          generate_release_notes: true

      - name: Purge Cloudflare cache
        if: vars.CF_ZONE_ID != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            curl -fsSL -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"prefixes":["releases/"]}'
          fi
